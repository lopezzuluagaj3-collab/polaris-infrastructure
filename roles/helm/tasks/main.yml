- name: Instalar Helm en el Control Plane
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Instalar Cilium CLI
  ansible.builtin.shell: |
    CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
    CLI_ARCH=amd64
    if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
    curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz
    tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
    rm cilium-linux-${CLI_ARCH}.tar.gz
  args:
    creates: /usr/local/bin/cilium

- name: Verificar si el release Helm de Cilium ya existe
  ansible.builtin.command: /usr/local/bin/helm status cilium -n kube-system
  register: cilium_release
  changed_when: false
  failed_when: false
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config

- name: Instalar CNI Cilium con eBPF (clúster nuevo)
  ansible.builtin.command: >
    /usr/local/bin/cilium install
    --set k8sServiceHost={{ k3s_control_plane_ip }}
    --set k8sServicePort=6443
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: cilium_release.rc != 0

- name: Actualizar CNI Cilium con eBPF (clúster existente)
  ansible.builtin.command: >
    /usr/local/bin/cilium upgrade
    --set k8sServiceHost={{ k3s_control_plane_ip }}
    --set k8sServicePort=6443
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: cilium_release.rc == 0