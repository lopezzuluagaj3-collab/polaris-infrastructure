---
# Nginx actúa como proxy TCP mediante el módulo stream.

- name: Instalar Nginx con módulo stream
  ansible.builtin.apt:
    name: nginx-extras
    state: present
    update_cache: true

- name: Eliminar carga manual duplicada del módulo stream
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^load_module.*ngx_stream_module\.so'
    state: absent

- name: Crear directorio stream-enabled
  ansible.builtin.file:
    path: /etc/nginx/stream-enabled
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deshabilitar el sitio HTTP predeterminado para liberar el puerto 80
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Eliminar includes gestionados previamente en una ubicación incorrecta
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*include /etc/nginx/(modules-enabled/\*\.conf|stream-enabled/\*\.conf);\s*$'
    state: absent

- name: Cargar módulos de Nginx desde el contexto raíz
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    line: "include /etc/nginx/modules-enabled/*.conf;"
    insertbefore: BOF
    state: present

- name: Incluir configuraciones stream desde el contexto raíz
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    line: "include /etc/nginx/stream-enabled/*.conf;"
    insertafter: '^include /etc/nginx/modules-enabled/\*\.conf;$'
    state: present

- name: Desplegar configuración de forwarding 80/443 -> NodePort del control-plane
  ansible.builtin.template:
    src: airflow-stream.conf.j2
    dest: /etc/nginx/stream-enabled/airflow-stream.conf
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/nginx -t -c %s'
  notify: Reiniciar nginx

- name: Validar configuración completa de Nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Habilitar e iniciar Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started